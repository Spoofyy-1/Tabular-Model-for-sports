name: Collect historical county air quality context CSVs
on:
  push:
    branches: [main]
    paths: ['air_quality/**', '.github/workflows/air-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: air-quality-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s air_quality -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python air_quality/collect.py 2>&1 | tee dist/air_quality_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: air-quality-context
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: air-quality-context
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="air-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'EPA AirData county-day air quality context, requested years 2000–2025. Inspect the summary for completed years and exclusions. Preserves source data and normalized CSVs, schemas, hashes and public-domain attribution. County daily AQI is regional retrospective context; it is not a stadium/court sensor, forecast, pollutant concentration, smoke-specific measure, or verified pregame observation. No sports/venue joins or training. Calendar 2025 is a separate holdout partition. Source revisions and historical availability remain explicit.' > notes.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "County air quality context ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
