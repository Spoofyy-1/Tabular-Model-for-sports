name: Compare NFL weather and player performance CSVs
on:
  push:
    branches: [main]
    paths: ['weather_performance/**', '.github/workflows/weather-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weather-performance
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s weather_performance -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python weather_performance/nfl.py 2>&1 | tee dist/weather_performance_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: weather-performance
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: weather-performance
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="weather-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Retrospective NFL weather and player-outcome joins with descriptive group summaries. Actual weather is not a historical forecast; indoor and unknown roof states stay distinct. Inspect source units, join quality, missingness and cohort denominators. Development through calendar 2024 remains separate from 2025 onward; no causal, profitable or model-fit claim. Temperature conversions explicitly assume Fahrenheit; its unit remains unverified in this source dictionary.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NFL weather performance CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NFL weather performance diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
