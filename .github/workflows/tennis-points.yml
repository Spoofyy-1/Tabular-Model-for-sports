name: Collect tennis point research CSVs
on:
  push:
    branches: [main]
    paths: ['tennis/point_data.py', 'tennis/test_point_data.py', 'tennis/package.py', '.github/workflows/tennis-points.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tennis-points
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s tennis -p test_point_data.py
      - name: Collect point data on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python tennis/point_data.py 2>&1 | tee dist/tennis_points_build.log
          python tennis/package.py --dataset points
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tennis-points
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tennis-points
          path: dist
      - name: Publish licensed research CSVs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="tennis-points-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Match Charting Project point research, attributed to Jeff Sackmann/Tennis Abstract and contributors. CC BY-NC-SA 4.0: research-only, noncommercial, share-alike. Source CSVs, pre-point score context, separately marked outcome labels and descriptive pre-2025 player screens. These are selected charted matches, not verified live trade timing or betting profitability. All data processing ran in GitHub cloud.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis point research CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            printf '%s\n' 'INCOMPLETE COLLECTION. Diagnostic output only; do not treat as a complete dataset.' >> notes.md
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis point diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
