name: Compare NBA attendance and player performance CSVs
on:
  push:
    branches: [main]
    paths: ['crowd_performance/**', '.github/workflows/crowd-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crowd-performance
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s crowd_performance -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python crowd_performance/nba.py 2>&1 | tee dist/crowd_performance_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: crowd-performance
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: crowd-performance
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="crowd-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          coverage="$(python -c 'import json,pathlib; p=pathlib.Path("dist/nba_crowd_performance_summary.json"); print(json.loads(p.read_text()).get("status", "missing") if p.exists() else "missing")')"
          printf '%s\n' 'Retrospective NBA reported attendance, source capacity and player-outcome comparisons. Actual occupancy, crowd noise and historical capacity validity remain unverified. Inspect zero/missing attendance, ratio flags, exact game joins and outcome denominators. Calendar development and holdout periods remain separate. No causal effect, betting edge or model training is established.' > notes.md
          if [ "$RESULT" = success ] && [ "$coverage" = complete ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NBA attendance performance CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NBA attendance performance diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
