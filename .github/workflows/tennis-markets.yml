name: Audit tennis market CSV history
on:
  push:
    branches: [main]
    paths: ['tennis/market_data.py', 'tennis/test_market_data.py', '.github/workflows/tennis-markets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tennis-markets
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s tennis -p test_market_data.py
      - name: Collect bounded PMXT pilot
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python tennis/market_data.py --output-dir data/tennis/pmxt_market_pilot 2>&1 | tee dist/tennis_markets_build.log
          python tennis/package.py --dataset markets
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tennis-markets
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tennis-markets
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="tennis-markets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Bounded PMXT historical tennis market pilot, CC BY 4.0 with attribution. Inspect coverage status and counts: successful workflow execution may yield only a coverage audit if files or verified mappings are unavailable. Scheduled match time is not a point clock. This release does not establish trading profitability or executable after-serve timing.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis market history audit ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis market diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
