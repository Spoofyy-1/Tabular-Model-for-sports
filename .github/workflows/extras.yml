name: Collect unusual sports context CSVs
on:
  push:
    branches: [main]
    paths: ['extras/**', '.github/workflows/extras.yml']
  workflow_dispatch:
    inputs:
      dataset:
        description: Collector to run
        type: choice
        default: all
        options: [all, nfl_profiles, celebrity_context, tennis_context, officials_context]
permissions:
  contents: read
concurrency:
  group: sports-extras
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      datasets: ${{ steps.select.outputs.datasets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.dataset }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          known = ['nfl_profiles', 'celebrity_context', 'tennis_context', 'officials_context']
          available = [name for name in known if pathlib.Path('extras/' + name + '.py').is_file()]
          if os.environ['EVENT'] == 'workflow_dispatch':
              requested = os.environ.get('REQUESTED', 'all') or 'all'
              selected = available if requested == 'all' else [requested]
              if any(name not in available for name in selected):
                  raise ValueError('Requested collector is unavailable')
          else:
              before = os.environ.get('BEFORE', '')
              if not re.fullmatch('[0-9a-f]{40}', before) or before == '0' * 40:
                  selected = available
              else:
                  changed = set(subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines())
                  shared = {'extras/package.py', '.github/workflows/extras.yml'}
                  selected = available if changed & shared else [name for name in available if changed & {'extras/' + name + '.py', 'extras/test_' + name + '.py'}]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('datasets=' + json.dumps(selected) + '\n')
          print('Selected collectors:', ', '.join(selected))
          PY
  collect:
    needs: plan
    if: needs.plan.outputs.datasets != '[]'
    name: Context ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.plan.outputs.datasets) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - if: matrix.dataset == 'celebrity_context'
        run: |
          python -m pip install 'beautifulsoup4>=4.12,<5' 'spacy>=3.8,<3.9'
          python -m pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Synthetic collector tests
        env:
          DATASET: ${{ matrix.dataset }}
        run: python -m unittest discover -s extras -p "test_${DATASET}.py"
      - name: Collect hosted CSV context
        env:
          DATASET: ${{ matrix.dataset }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python "extras/${DATASET}.py" 2>&1 | tee "dist/${DATASET}_build.log"
      - name: Package outputs and coverage audit
        if: always()
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          if [ -f "data/extras/$DATASET/summary.json" ]; then
            python extras/package.py --dataset "$DATASET"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: extras-${{ matrix.dataset }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [plan, collect]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.datasets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: extras-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="extras-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Exploratory sports context CSVs collected only on GitHub-hosted runners. NFL combine/draft profiles, public celebrity-presence evidence, and tennis venue/weather research. Each source retains separate license/rights and historical-availability notes. Review coverage and exclusions; no verified betting edge, complete celebrity attendance universe or automatic model eligibility is claimed.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Exploratory sports context CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            printf '%s\n' 'PARTIAL COLLECTION. Check each individual collector summary and log.' >> notes.md
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Sports context diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
