name: Collect sparse NFL attendance claims and game links
on:
  push:
    branches: [main]
    paths: ['nfl_attendance/**', '.github/workflows/nfl-attendance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nfl-attendance
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s nfl_attendance -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python nfl_attendance/collect.py 2>&1 | tee dist/nfl_attendance_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nfl-attendance
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: nfl-attendance
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="nfl-attendance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Bounded five-Super-Bowl pilot using direct CC0 Wikidata claims and a pinned existing NFL schedule. Inspect summary coverage, missing/conflicting attendance and exact participant/date/game-type links. Nominal home roles and venue evidence remain separately checked. No gamebook/PFR scrape, capacity ratio, verified physical occupancy, causal effect or training claim. These selected championship games do not represent general NFL attendance coverage. CC0 claims and NFL schedule attribution remain separate.' > notes.md
          if [ "$RESULT" = success ]; then
            title="Sparse NFL attendance pilot ${GITHUB_RUN_NUMBER}"
          else
            title="NFL attendance diagnostics ${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease --latest=false
