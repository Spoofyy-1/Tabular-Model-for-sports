name: Align tennis match dates with existing weather CSVs
on:
  push:
    branches: [main]
    paths: ['tennis_weather/**', '.github/workflows/tennis-weather.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tennis-weather
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s tennis_weather -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python tennis_weather/collect.py 2>&1 | tee dist/tennis_weather_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tennis-weather
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tennis-weather
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="tennis-weather-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Limited Wimbledon date/court alignment pilot. Reuses pinned historical daily weather; makes no new weather requests. Inspect accepted identities and exclusions before use. Overlapping UTC daily buckets are separate calendar-day context, not weather during play. Actual start/end, roof operation and attendance remain unknown. CC0 facts and MCP/weather noncommercial research outputs retain separate source rights. No model training or trading validation.' > notes.md
          if [ "$RESULT" = success ]; then
            title="Tennis daily weather alignment pilot ${GITHUB_RUN_NUMBER}"
          else
            title="Tennis daily weather alignment diagnostics ${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease --latest=false
