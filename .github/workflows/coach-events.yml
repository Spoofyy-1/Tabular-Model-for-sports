name: Collect dated coach appointment CSVs
on:
  push:
    branches: [main]
    paths: ['coach_events/**', '.github/workflows/coach-events.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coach-events
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python -m unittest discover -s coach_events -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python coach_events/collect.py 2>&1 | tee dist/coach_events_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coach-events
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: coach-events
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="coach-events-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Dated NBA/NFL appointment and agreement announcements from primary team pages. Effective employment intervals and first game assignments remain unknown unless separately supported. Only normalized factual annotations and provenance, no article bodies. Inspect source coverage and date precision; no automatic model joins, training or trading.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Coach appointment CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Coach appointment diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
