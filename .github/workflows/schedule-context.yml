name: Collect schedule density and continuity CSVs
on:
  push:
    branches: [main]
    paths: ['schedule_context/**', '.github/workflows/schedule-context.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schedule-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s schedule_context -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python schedule_context/collect.py 2>&1 | tee dist/schedule_context_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: schedule-context
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: schedule-context
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="schedule-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'NBA/NFL schedule-density candidates and retrospective coaching/venue continuity audits. Actual travel, physiological rest, verified coach tenure and historical publication timing are unknown. Prior source rights retained; CSV null token is \N. No training or trading.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Schedule context CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Schedule context diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
