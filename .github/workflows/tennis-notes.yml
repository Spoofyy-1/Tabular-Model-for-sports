name: Collect tennis note context CSVs
on:
  push:
    branches: [main]
    paths: ['tennis/notes_context.py', 'tennis/test_notes_context.py', 'tennis/package_notes.py', '.github/workflows/tennis-notes.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tennis-note-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s tennis -p test_notes_context.py
      - name: Extract candidate mentions on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python tennis/notes_context.py 2>&1 | tee dist/tennis_notes_build.log
          python tennis/package_notes.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tennis-notes
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tennis-notes
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="tennis-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'MCP note mention candidates, CC BY-NC-SA 4.0; isolated noncommercial research only. Candidate mentions are not independently verified incidents or automatically valid prediction features. Inspect coverage, source row identities and date/point join exclusions.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis note context CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis note context diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
