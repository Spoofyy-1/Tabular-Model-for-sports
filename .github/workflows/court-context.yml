name: Collect historical tennis court context CSVs
on:
  push:
    branches: [main]
    paths: ['court_context/**', '.github/workflows/court-context.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: court-context
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s court_context -p 'test_*.py'
      - name: Collect on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python court_context/osm_infrastructure.py 2>&1 | tee dist/court_context_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: court-context
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: court-context
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="court-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Historical OpenStreetMap tennis court infrastructure candidates, ODbL attribution and share-alike terms preserved. Snapshot/map edit dates are not infrastructure effective dates. Facility associations unverified; no match-specific roof-open, lighting-use or surface condition claims. Inspect missingness and HTTP coverage; no training or trading.' > notes.md
          coverage_status=$(python -c 'import json,pathlib; p=pathlib.Path("dist/court_context_summary.json"); print(json.loads(p.read_text()).get("status", "missing") if p.exists() else "missing")')
          if [ "$RESULT" = success ] && [ "$coverage_status" = complete ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Historical court context CSVs ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            printf '%s\n' "Coverage status: $coverage_status. Partial or blocked pilot; inspect aggregate summary before using any rows." >> notes.md
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Historical court context diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
