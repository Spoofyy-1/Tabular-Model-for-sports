name: Diagnose tennis identity joins from pinned CSV archives
on:
  push:
    branches: [main]
    paths: ['tennis_alignment_diagnostic/**', '.github/workflows/tennis-alignment-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tennis-alignment-diagnostic
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s tennis_alignment_diagnostic -p 'test_*.py'
      - name: Diagnose on hosted runner
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python tennis_alignment_diagnostic/collect.py 2>&1 | tee dist/tennis_alignment_diagnostic_build.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tennis-alignment-diagnostic
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tennis-alignment-diagnostic
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="tennis-alignment-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Aggregate identity diagnostics using only pinned existing MCP and Wikidata-fact archives. No new live API or weather requests. Inspect raw-versus-normalized metadata, exact tournament/date/round/name gates, source alias omissions and ambiguity counts. This release does not accept new match/weather joins, infer court/time/roof fields or train a model. MCP-derived diagnostics retain noncommercial share-alike restrictions; keep source rights and provenance.' > notes.md
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Tennis identity diagnostic ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
