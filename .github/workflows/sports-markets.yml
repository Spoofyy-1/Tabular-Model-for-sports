name: Collect NBA NFL market activity CSVs
on:
  push:
    branches: [main]
    paths: ['markets/**', '.github/workflows/sports-markets.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-market-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r context_requirements.txt
      - run: python -m unittest discover -s markets -p 'test_*.py'
      - run: python -m unittest discover -s tennis -p 'test_*data.py'
      - name: Collect bounded historical quotes remotely
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p dist
          set -o pipefail
          python markets/pmxt_sports.py --output-dir data/markets/sports_pilot 2>&1 | tee dist/sports_market_build.log
          python markets/package.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sports-markets
          path: dist/
          compression-level: 0
          retention-days: 7
  publish:
    needs: collect
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sports-markets
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.collect.result }}
        run: |
          set -euo pipefail
          tag="sports-markets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' 'Bounded NBA/NFL PMXT historical market activity CSV pilot, CC BY 4.0. Review source coverage, exact contract mappings, and historical-rule limitations. Observed message sizes are not guaranteed unique trading volume. Quote timestamps precede reviewed scheduled starts; actual event starts and historical execution conditions remain unverified. No betting profitability evaluation.' > notes.md
          if [ "$RESULT" = success ]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NBA NFL market activity pilot ${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest=false
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "NBA NFL market diagnostics ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --latest=false
          fi
